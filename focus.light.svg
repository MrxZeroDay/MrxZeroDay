<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Current focus: learning new .NET and Laravel patterns, building private enterprise projects, shipping payment flows, dashboards and APIs">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .p { fill: #1a7f37; font-size: 14px; }
    .k { fill: #ffffff; font-size: 12px; font-weight: 700; }
    .v { fill: #1f2328; font-size: 15px; }
    .dim { fill: #6e7781; font-size: 13px; }
    .r1 { opacity: 0; animation: in 0.01s linear 0.3s forwards; }
    .r2 { opacity: 0; animation: in 0.01s linear 1.0s forwards; }
    .r3 { opacity: 0; animation: in 0.01s linear 1.7s forwards; }
    .dot { animation: pulse 1.6s ease-in-out infinite; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes in { to { opacity: 1; } }
    @keyframes pulse { 50% { opacity: 0.25; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect x="10" y="10" width="880" height="170" rx="10" fill="#ffffff" stroke="#b6d9c0" stroke-width="1.5"/>
  <text x="32" y="40" class="mono p">$ <tspan fill="#24292f">status --now</tspan></text>
  <circle class="dot" cx="862" cy="35" r="5" fill="#1a7f37"/>
  <text x="846" y="40" text-anchor="end" class="mono dim">live</text>

  <g class="r1">
    <rect x="32" y="62" width="104" height="24" rx="5" fill="#1a7f37"/>
    <text x="84" y="78" text-anchor="middle" class="mono k">LEARNING</text>
    <text x="156" y="79" class="mono v">new .NET and Laravel patterns</text>
  </g>
  <g class="r2">
    <rect x="32" y="98" width="104" height="24" rx="5" fill="#1a7f37" opacity="0.75"/>
    <text x="84" y="114" text-anchor="middle" class="mono k">BUILDING</text>
    <text x="156" y="115" class="mono v">private enterprise projects</text>
  </g>
  <g class="r3">
    <rect x="32" y="134" width="104" height="24" rx="5" fill="#1a7f37" opacity="0.5"/>
    <text x="84" y="150" text-anchor="middle" class="mono k">SHIPPING</text>
    <text x="156" y="151" class="mono v">payment flows, dashboards, APIs<tspan class="cur" fill="#1a7f37">_</tspan></text>
  </g>
</svg>
