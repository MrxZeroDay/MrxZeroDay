<svg xmlns="http://www.w3.org/2000/svg" width="560" height="232" viewBox="0 0 560 232" role="img" aria-label="Contributions by day of the week in the last year">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .dim { fill: #6e7781; font-size: 11px; }
    .txt { fill: #1f2328; font-size: 13px; }
    .cap { fill: #57606a; font-size: 12px; }
    .acc { fill: #1a7f37; font-size: 12px; }
    .num { fill: #1f2328; font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8f6ec"/></linearGradient>
    <clipPath id="f"><rect x="5" y="5" width="550" height="222" rx="10"/></clipPath>
  </defs>
  <rect x="5" y="5" width="550" height="222" rx="10" fill="url(#bg)" stroke="#b6d9c0" stroke-width="1.5"/>
  <g clip-path="url(#f)">
