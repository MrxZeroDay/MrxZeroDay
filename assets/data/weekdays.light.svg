    <text x="28" y="111" class="mono cap">Wed</text>
    <rect x="75" y="100" width="300" height="14" rx="4" fill="#eaeef2"/>
    <rect x="75" y="100" width="300" height="14" rx="4" fill="#1a7f37"/>
    <text x="390" y="111" class="mono num">348</text>
