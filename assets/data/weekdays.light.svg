    <circle cx="24" cy="20" r="5" fill="#ff5f56"/><circle cx="42" cy="20" r="5" fill="#ffbd2e"/><circle cx="60" cy="20" r="5" fill="#27c93f"/>
    <text x="280" y="24" text-anchor="middle" class="mono dim">activity --by-weekday</text>
    <text x="28" y="63" class="mono cap">Mon</text>
    <rect x="75" y="52" width="300" height="14" rx="4" fill="#eaeef2"/>
