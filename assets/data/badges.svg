<svg xmlns="http://www.w3.org/2000/svg" width="560" height="198" viewBox="0 0 560 198" role="img" aria-label="Achievements unlocked from GitHub activity">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .dim { fill: #6e7681; font-size: 11px; }
    .txt { fill: #e6edf3; font-size: 13px; }
    .cap { fill: #8b949e; font-size: 12px; }
    .acc { fill: #39ff14; font-size: 12px; }
    .num { fill: #e6edf3; font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0a1f12"/></linearGradient>
    <clipPath id="f"><rect x="5" y="5" width="550" height="188" rx="10"/></clipPath>
  </defs>
  <rect x="5" y="5" width="550" height="188" rx="10" fill="url(#bg)" stroke="#1f3a28" stroke-width="1.5"/>
  <g clip-path="url(#f)">
    <rect x="5" y="5" width="550" height="30" fill="#161b22"/>
    <circle cx="24" cy="20" r="5" fill="#ff5f56"/><circle cx="42" cy="20" r="5" fill="#ffbd2e"/><circle cx="60" cy="20" r="5" fill="#27c93f"/>
    <text x="280" y="24" text-anchor="middle" class="mono dim">achievements --unlocked</text>
    <g opacity="0.35"><rect x="24" y="50" width="120" height="58" rx="8" fill="#161b22" stroke="#1f3a28"/>
    <text x="34" y="74" class="mono txt">· Veteran</text>
    <text x="34" y="93" class="mono dim">5+ years</text></g>
    <g opacity="0.35"><rect x="156" y="50" width="120" height="58" rx="8" fill="#161b22" stroke="#1f3a28"/>
    <text x="166" y="74" class="mono txt">· On fire</text>
    <text x="166" y="93" class="mono dim">7-day streak</text></g>
    <g opacity="0.35"><rect x="288" y="50" width="120" height="58" rx="8" fill="#161b22" stroke="#1f3a28"/>
    <text x="298" y="74" class="mono txt">· Marathon</text>
    <text x="298" y="93" class="mono dim">30-day streak</text></g>
    <g opacity="1"><rect x="420" y="50" width="120" height="58" rx="8" fill="#161b22" stroke="#39ff14"/>
    <text x="430" y="74" class="mono txt">✔ Busy bee</text>
    <text x="430" y="93" class="mono dim">500+ / year</text></g>
    <g opacity="1"><rect x="24" y="120" width="120" height="58" rx="8" fill="#161b22" stroke="#39ff14"/>
    <text x="34" y="144" class="mono txt">✔ Maker</text>
    <text x="34" y="163" class="mono dim">10+ repos</text></g>
    <g opacity="1"><rect x="156" y="120" width="120" height="58" rx="8" fill="#161b22" stroke="#39ff14"/>
    <text x="166" y="144" class="mono txt">✔ Shark</text>
    <text x="166" y="163" class="mono dim">merged PR</text></g>
    <g opacity="0.35"><rect x="288" y="120" width="120" height="58" rx="8" fill="#161b22" stroke="#1f3a28"/>
    <text x="298" y="144" class="mono txt">· Starred</text>
    <text x="298" y="163" class="mono dim">first star</text></g>
    <g opacity="1"><rect x="420" y="120" width="120" height="58" rx="8" fill="#161b22" stroke="#39ff14"/>
    <text x="430" y="144" class="mono txt">✔ Centurion</text>
    <text x="430" y="163" class="mono dim">1000+ / year</text></g>
  </g>
</svg>
