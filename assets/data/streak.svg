<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" role="img" aria-label="Contribution streaks for MrxZeroDay">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .dim { fill: #6e7681; font-size: 11px; }
    .num { fill: #e6edf3; font-size: 28px; font-weight: 700; }
    .lab { fill: #39ff14; font-size: 12px; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0a1f12"/></linearGradient>
    <clipPath id="f"><rect x="5" y="5" width="550" height="150" rx="10"/></clipPath>
  </defs>
  <rect x="5" y="5" width="550" height="150" rx="10" fill="url(#bg)" stroke="#1f3a28" stroke-width="1.5"/>
  <g clip-path="url(#f)">
    <rect x="5" y="5" width="550" height="30" fill="#161b22"/>
    <circle cx="24" cy="20" r="5" fill="#ff5f56"/><circle cx="42" cy="20" r="5" fill="#ffbd2e"/><circle cx="60" cy="20" r="5" fill="#27c93f"/>
    <text x="280" y="24" text-anchor="middle" class="mono dim">gh streak --year</text>
    <line x1="143" y1="64" x2="143" y2="136" stroke="#1f3a28"/><line x1="280" y1="64" x2="280" y2="136" stroke="#1f3a28"/><line x1="417" y1="64" x2="417" y2="136" stroke="#1f3a28"/>
    <text x="75" y="92" text-anchor="middle" class="mono num">3</text><text x="75" y="114" text-anchor="middle" class="mono lab">current streak</text><text x="75" y="130" text-anchor="middle" class="mono dim">days</text><text x="212" y="92" text-anchor="middle" class="mono num">5</text><text x="212" y="114" text-anchor="middle" class="mono lab">longest streak</text><text x="212" y="130" text-anchor="middle" class="mono dim">days</text><text x="349" y="92" text-anchor="middle" class="mono num">195</text><text x="349" y="114" text-anchor="middle" class="mono lab">active days</text><text x="349" y="130" text-anchor="middle" class="mono dim">last year</text><text x="486" y="92" text-anchor="middle" class="mono num">87</text><text x="486" y="114" text-anchor="middle" class="mono lab">best day</text><text x="486" y="130" text-anchor="middle" class="mono dim">2026-10-30</text>
  </g>
</svg>
