<svg xmlns="http://www.w3.org/2000/svg" width="560" height="232" viewBox="0 0 560 232" role="img" aria-label="Contributions by day of the week in the last year">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .dim { fill: #6e7681; font-size: 11px; }
    .txt { fill: #e6edf3; font-size: 13px; }
    .cap { fill: #8b949e; font-size: 12px; }
    .acc { fill: #39ff14; font-size: 12px; }
    .num { fill: #e6edf3; font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0a1f12"/></linearGradient>
    <clipPath id="f"><rect x="5" y="5" width="550" height="222" rx="10"/></clipPath>
  </defs>
  <rect x="5" y="5" width="550" height="222" rx="10" fill="url(#bg)" stroke="#1f3a28" stroke-width="1.5"/>
  <g clip-path="url(#f)">
    <rect x="5" y="5" width="550" height="30" fill="#161b22"/>
    <circle cx="24" cy="20" r="5" fill="#ff5f56"/><circle cx="42" cy="20" r="5" fill="#ffbd2e"/><circle cx="60" cy="20" r="5" fill="#27c93f"/>
    <text x="280" y="24" text-anchor="middle" class="mono dim">activity --by-weekday</text>
    <text x="28" y="63" class="mono cap">Mon</text>
    <rect x="75" y="52" width="300" height="14" rx="4" fill="#161b22"/>
    <rect x="75" y="52" width="201" height="14" rx="4" fill="#1f6b35"/>
    <text x="390" y="63" class="mono num">236</text>
    <text x="28" y="87" class="mono cap">Tue</text>
    <rect x="75" y="76" width="300" height="14" rx="4" fill="#161b22"/>
    <rect x="75" y="76" width="268" height="14" rx="4" fill="#1f6b35"/>
    <text x="390" y="87" class="mono num">315</text>
    <text x="28" y="111" class="mono cap">Wed</text>
    <rect x="75" y="100" width="300" height="14" rx="4" fill="#161b22"/>
    <rect x="75" y="100" width="300" height="14" rx="4" fill="#39ff14"/>
    <text x="390" y="111" class="mono num">353</text>
    <text x="28" y="135" class="mono cap">Thu</text>
    <rect x="75" y="124" width="300" height="14" rx="4" fill="#161b22"/>
