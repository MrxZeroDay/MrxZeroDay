<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="MrxZeroDay terminal header">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .dim { fill: #6e7681; font-size: 14px; }
    .prompt { fill: #39ff14; font-size: 15px; }
    .out { fill: #c9d1d9; font-size: 15px; }
    .title { font-size: 68px; font-weight: 700; letter-spacing: 2px; }
    .l1 { opacity: 0; animation: show 0.01s linear 0.4s forwards; }
    .l2 { opacity: 0; animation: show 0.01s linear 1.4s forwards; }
    .l3 { opacity: 0; animation: show 0.01s linear 2.2s forwards; }
    .g1 { animation: glitch1 5s steps(1) infinite; }
    .g2 { animation: glitch2 5s steps(1) infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .scan { animation: scan 6s linear infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes glitch1 { 0%,92%,100% { transform: translate(0,0); } 93% { transform: translate(-4px,1px); } 95% { transform: translate(3px,-1px); } 97% { transform: translate(-2px,0); } }
    @keyframes glitch2 { 0%,92%,100% { transform: translate(0,0); } 93% { transform: translate(4px,-1px); } 95% { transform: translate(-3px,1px); } 97% { transform: translate(2px,0); } }
    @keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(320px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1f12"/>
    </linearGradient>
    <clipPath id="frame"><rect x="10" y="10" width="880" height="280" rx="12"/></clipPath>
  </defs>

  <rect x="10" y="10" width="880" height="280" rx="12" fill="url(#bg)" stroke="#1f3a28" stroke-width="1.5"/>

  <g clip-path="url(#frame)">
    <rect x="10" y="10" width="880" height="34" fill="#161b22"/>
    <circle cx="34" cy="27" r="6" fill="#ff5f56"/>
    <circle cx="56" cy="27" r="6" fill="#ffbd2e"/>
    <circle cx="78" cy="27" r="6" fill="#27c93f"/>
    <text x="450" y="32" text-anchor="middle" class="mono dim">mrxzeroday@dev: ~</text>

    <g class="scan" opacity="0.07">
      <rect x="10" y="0" width="880" height="14" fill="#39ff14"/>
    </g>

    <text x="40" y="78" class="mono prompt l1">$ <tspan class="out">whoami</tspan></text>

    <g class="mono title" text-anchor="start">
      <text x="40" y="160" fill="#ff2e63" opacity="0.7" class="g1">MrxZeroDay</text>
      <text x="40" y="160" fill="#00e5ff" opacity="0.7" class="g2">MrxZeroDay</text>
      <text x="40" y="160" fill="#39ff14">MrxZeroDay</text>
    </g>

    <text x="40" y="205" class="mono out l2">Full-Stack Developer  ·  Backend Specialist</text>

    <text x="40" y="250" class="mono prompt l3">&gt; <tspan class="out">exploring systems, writing code, learning how things work</tspan><tspan class="cursor" fill="#39ff14">_</tspan></text>
  </g>
</svg>
