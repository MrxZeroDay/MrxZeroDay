<svg xmlns="http://www.w3.org/2000/svg" width="560" height="56" viewBox="0 0 560 56" role="img" aria-label="end of transmission">
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; font-size: 13px; }
    .g { fill: #39ff14; } .t { fill: #e6edf3; } .d { fill: #6e7681; } .m { fill: #8b949e; }
    .blink { animation: b 1s steps(1) infinite; } @keyframes b { 50% { opacity: 0; } }
    
  </style>
  <defs><linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#39ff14" stop-opacity="0"/><stop offset="0.5" stop-color="#39ff14" stop-opacity="0.7"/><stop offset="1" stop-color="#39ff14" stop-opacity="0"/></linearGradient></defs>
  <rect x="40" y="10" width="480" height="1.5" fill="url(#a)"/>
  <text x="280" y="38" text-anchor="middle" class="g" style="font-size:15px">&gt; end of transmission<tspan class="blink">_</tspan></text>
</svg>
