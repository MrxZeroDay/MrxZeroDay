name: Update profile cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      USERNAME: MrxZeroDay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate 3D contribution calendar (EN/RU, dark/light)
        run: |
          node scripts/generate_contrib3d.mjs assets/data/contrib-3d.svg
          THEME=light node scripts/generate_contrib3d.mjs assets/data/contrib-3d.light.svg
          LANG_CODE=ru node scripts/generate_contrib3d.mjs assets/data/contrib-3d.ru.svg
          LANG_CODE=ru THEME=light node scripts/generate_contrib3d.mjs assets/data/contrib-3d.ru.light.svg

      - name: Generate stats and language cards
        run: python3 scripts/generate_stats.py assets/data/stats.svg

      - name: Derive light theme variants
        run: node scripts/make_light.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update profile cards"
          git pull --rebase --autostash origin main
          git push
